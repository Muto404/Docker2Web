name: pdm-button-qa
services:
  web:
    image: node:22.22.0-bookworm-slim
    command: ['node', '/app/server.mjs']
    environment:
      QA_SERVICE: web
    ports:
      - '19080:8080'
    volumes:
      - ./server.mjs:/app/server.mjs:ro
    read_only: true
  multi:
    image: node:22.22.0-bookworm-slim
    command: ['node', '/app/server.mjs']
    environment:
      QA_SERVICE: multi
    ports:
      - '19081:8080'
      - '19082:8081'
    volumes:
      - ./server.mjs:/app/server.mjs:ro
    read_only: true
  internal:
    image: node:22.22.0-bookworm-slim
    command: ['node', '/app/server.mjs']
    environment:
      QA_SERVICE: internal
    volumes:
      - ./server.mjs:/app/server.mjs:ro
    read_only: true
